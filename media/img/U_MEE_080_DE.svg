<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Sicherheit, Verantwortung und Nachhaltigkeit</title><desc id="desc">Entscheidungsfolge von Gefährdungsermittlung über Maßnahmen bis zum erneuten Nachweis.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#334155"/></marker></defs><rect width="960" height="600" fill="#fff"/><g font-family="Arial, sans-serif"><text x="40" y="60" font-size="32" fill="#172b3b" text-anchor="start">Sicherheit, Verantwortung und Nachhaltigkeit</text><line x1="40" y1="86" x2="920" y2="86" stroke="#cbd5e1" stroke-width="2"/><rect x="45" y="180" width="195" height="95" fill="#e2e8f0" stroke="#334155" stroke-width="2"/><text x="142.5" y="236.5" font-size="24" fill="#172b3b" text-anchor="middle">Gefährdung</text><rect x="270" y="180" width="195" height="95" fill="#e2e8f0" stroke="#334155" stroke-width="2"/><text x="367.5" y="236.5" font-size="24" fill="#172b3b" text-anchor="middle">Bewertung</text><rect x="495" y="180" width="195" height="95" fill="#e2e8f0" stroke="#334155" stroke-width="2"/><text x="592.5" y="236.5" font-size="24" fill="#172b3b" text-anchor="middle">Maßnahme</text><rect x="720" y="180" width="195" height="95" fill="#e2e8f0" stroke="#334155" stroke-width="2"/><text x="817.5" y="236.5" font-size="24" fill="#172b3b" text-anchor="middle">Nachweis</text><line x1="240" y1="227" x2="270" y2="227" stroke="#334155" stroke-width="3" marker-end="url(#arr)"/><line x1="465" y1="227" x2="495" y2="227" stroke="#334155" stroke-width="3" marker-end="url(#arr)"/><line x1="690" y1="227" x2="720" y2="227" stroke="#334155" stroke-width="3" marker-end="url(#arr)"/><polyline points="817,275 817,375 142,375 142,280" fill="none" stroke="#116b91" stroke-width="4"/><line x1="142" y1="375" x2="142" y2="280" stroke="#116b91" stroke-width="3" marker-end="url(#arr)"/><text x="480" y="415" font-size="26" fill="#172b3b" text-anchor="middle">Bei unzureichendem Nachweis erneut bewerten</text><text x="480" y="520" font-size="26" fill="#172b3b" text-anchor="middle">Sicherheit ist ein eigenes Freigabekriterium</text></g></svg>
